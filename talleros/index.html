function navHTML(){document.getElementById('logo-icon').innerHTML=ic('wrench',21);document.getElementById('pin-icon').innerHTML=ic('pin',14);document.getElementById('help-icon').innerHTML=ic('help',17);document.getElementById('top-date').textContent=new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});document.getElementById('desktop-nav').innerHTML=NAV.map(([id,label,icon])=>`<button class="nav-btn ${page===id?'active':''}" onclick="navigate('${id}')">${ic(icon,19)}<span>${label}</span>${id==='orders'?`<span class="nav-count">${data.orders.filter(x=>x.status!=='done'&&x.status!=='cancelled').length}</span>`:''}</button>`).join('');let mob=[NAV[0],NAV[1],NAV[2],NAV[3],NAV[5]];document.getElementById('mobile-nav').innerHTML=mob.map(([id,label,icon])=>`<button onclick="navigate('${id}')" class="${page===id?'active':''}">${ic(icon,20)}<span>${label==='Visión general'?'Inicio':label==='Órdenes de trabajo'?'Órdenes':label==='Agenda y citas'?'Agenda':label}</span></button>`).join(''); if(page==='stock')document.getElementById('mobile-nav').innerHTML+=`<button class="active" onclick="navigate('stock')">${ic('stock',20)}<span>Stock</span></button>`;document.getElementById('crumb').textContent=NAV.find(x=>x[0]===page)?.[1]||'Inicio'}

window.filterPage=v=>{statusFilter=v;updateCurrentList()};
function updateCurrentList(){const fields={orders:ordersRows,clients:clientsRows,quotes:quotesRows,stock:stockRows};if(fields[page]){const el=document.getElementById('dynamic-rows');if(el)el.innerHTML=fields[page]()||`<tr><td colspan="6">${blank('No encontramos resultados con esos filtros.')}</td></tr>`;}const count=document.getElementById('record-count');if(count){const selectors={orders:filterOrders,clients:filterClients,stock:filterStock,quotes:filterQuotes};count.textContent=`${selectors[page]().length} resultados`}}
function stats(){const active=data.orders.filter(x=>['progress','waiting'].includes(x.status)).length;const appts=data.appointments.filter(x=>x.date===today()&&x.status==='confirmed').length;const pend=data.quotes.filter(x=>x.status==='pending').length;const total=data.orders.filter(x=>x.status==='done').reduce((a,x)=>a+(+x.price||0),0);return [{label:'Órdenes abiertas',value:active,note:'En curso y pendientes',icon:'wrench',color:''},{label:'Citas de hoy',value:appts,note:'Programadas en la agenda',icon:'calendar',color:'purple'},{label:'Presupuestos pendientes',value:pend,note:'Esperando respuesta',icon:'clock',color:'amber'},{label:'Trabajos finalizados',value:euro(total),note:'Importe base sin IVA',icon:'euro',color:'mint'}]}
function orderTableRows(arr){return arr.map(o=>{let c=client(o.clientId);return `<tr class="clickable" onclick="openOrder(${o.id})"><td><span class="primary-cell">#OT-${o.id}</span><span class="secondary-cell">${fmtDate(o.date)}</span></td><td><span class="primary-cell">${esc(c.name)}</span><span class="secondary-cell">${esc(c.car)}</span></td><td><span class="primary-cell">${esc(o.subject)}</span><span class="secondary-cell">${esc(o.plate||c.plate)}</span></td><td>${badge(o.status)}</td><td><span class="primary-cell">${euro(o.price)}</span></td><td><button class="tiny-button" onclick="event.stopPropagation();openOrder(${o.id})">Ver detalle ${ic('chevron',12)}</button></td></tr>`}).join('')}

<div class="preview"><div><div class="eyebrow">BIENVENIDO A TALLEROS</div><h2>Tu taller, organizado de principio a fin.</h2><p>Centraliza reparaciones, citas, clientes, repuestos y presupuestos en un solo lugar. Esta demo funciona con información de ejemplo.</p><div class="feature-tags"><span>✓ Sin instalar programas</span><span>✓ Interfaz sencilla</span><span>✓ Funcional sin conexión</span></div></div><button class="btn" onclick="openHelp()">Cómo funciona ${ic('chevron',15)}</button></div>
<div class="stats">${s.map(o=>`<div class="stat"><div class="stat-top"><span class="stat-label">${o.label}</span><span class="stat-icon ${o.color}">${ic(o.icon,19)}</span></div><div class="stat-num">${o.value}</div><div class="stat-note">${o.note}</div></div>`).join('')}</div>
<div class="dashboard-grid"><section class="panel"><div class="panel-head"><div><h2>Actividad del taller</h2><p>Vista ilustrativa de los últimos 7 días</p></div><span class="inline-chip">Ejemplo</span></div><div class="panel-body"><div class="bars">${vals.map((v,i)=>`<div class="bar-stack"><div class="bar-rect" style="--h:${v}%"></div><div class="bar-label">${['J','V','S','D','L','M','X'][i]}</div></div>`).join('')}</div><div class="chart-footer"><span>Gráfico ilustrativo · No representa ventas reales</span><strong>${data.orders.length} órdenes</strong></div></div></section>
<section class="panel"><div class="panel-head"><div><h2>Próximas citas</h2><p>Tus próximos vehículos programados</p></div><button class="text-link" onclick="navigate('calendar')">Ver agenda →</button></div><div class="event-list">${appts.length?appts.map(x=>`<div class="event"><div class="time">${x.time}<br><span style="font-size:9px;opacity:.7">${x.date===today()?'HOY':fmtDate(x.date).split(' ')[0]+' '+fmtDate(x.date).split(' ')[1]}</span></div><div class="event-body"><strong>${esc(x.type)}</strong><span>${esc(client(x.clientId).name)} · ${esc(client(x.clientId).plate)}</span></div><span class="dot"></span></div>`).join(''):blank('No hay citas próximas.')}</div></section></div>
<section class="panel"><div class="panel-head"><div><h2>Últimas órdenes de trabajo</h2><p>Controla el estado de cada reparación</p></div><button class="text-link" onclick="navigate('orders')">Ver todas →</button></div><div class="table-scroll"><table class="table"><thead><tr><th>N.º ORDEN</th><th>CLIENTE / VEHÍCULO</th><th>TRABAJO</th><th>ESTADO</th><th>IMPORTE</th><th></th></tr></thead><tbody>${orderTableRows([...data.orders].sort((a,b)=>b.id-a.id).slice(0,5))}</tbody></table></div></section>`}
function filterOrders(){return [...data.orders].sort((a,b)=>b.id-a.id).filter(o=>(statusFilter==='all'||o.status===statusFilter)&&[o.id,o.subject,o.plate,client(o.clientId).name,client(o.clientId).car].join(' ').toLowerCase().includes(searchTerm))}
function ordersRows(){return orderTableRows(filterOrders())}
function ordersView(){return `${pageHead('OPERACIONES','Órdenes de trabajo','Consulta, crea y actualiza todas las reparaciones del taller.',btn('Nueva orden','openNewOrder()'))}<div class="toolbar"><label class="search">${ic('search',18)}<input aria-label="Buscar órdenes" placeholder="Buscar por cliente, matrícula, reparación..." oninput="searchPage(this.value)" value="${esc(searchTerm)}"></label><select class="filter" aria-label="Filtrar estado" onchange="filterPage(this.value)"><option value="all">Todos los estados</option><option value="waiting">Pendientes</option><option value="progress">En reparación</option><option value="done">Finalizados</option><option value="cancelled">Cancelados</option></select></div>${tableWrap(['ORDEN','CLIENTE / VEHÍCULO','TRABAJO','ESTADO','IMPORTE','ACCIÓN'],ordersRows(),'Sin órdenes').replace('<tbody>', '<tbody id="dynamic-rows">')}<div class="section-foot" id="record-count">${filterOrders().length} resultados</div>`}
function agendaDateList(){const dates=[];for(let i=0;i<7;i++){const d=offsetDate(i);let obj=new Date(d+'T12:00:00');dates.push(`<button class="day ${selectedDay===d?'active':''}" onclick="selectDay('${d}')"><span>${obj.toLocaleDateString('es-ES',{weekday:'short'}).replace('.','')}</span><strong>${obj.getDate()}</strong><em>${data.appointments.filter(a=>a.date===d&&a.status==='confirmed').length} citas</em></button>`)}return dates.join('')}
function calendarView(){const all=data.appointments.filter(x=>x.date===selectedDay).sort((a,b)=>a.time.localeCompare(b.time));return `${pageHead('PLANIFICACIÓN','Agenda de citas','Organiza la llegada de los vehículos durante la semana.',btn('Nueva cita','openNewAppointment()','plus'))}<div class="week">${agendaDateList()}</div><div class="panel"><div class="panel-head"><div><h2>${new Date(selectedDay+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}</h2><p>${all.length} cita(s) para este día</p></div><span class="inline-chip">Agenda semanal</span></div>${all.length?`<div class="event-list" style="padding-top:8px">${all.map(x=>`<div class="event"><div class="time">${x.time}</div><div class="event-body"><strong>${esc(x.type)}</strong><span>${esc(client(x.clientId).name)} · ${esc(client(x.clientId).car)} · ${esc(client(x.clientId).plate)}</span></div>${x.status==='confirmed'?`<button class="btn small" onclick="cancelAppointment(${x.id})">Cancelar cita</button>`:badge('cancelled')}</div>`).join('')}</div>`:blank('No hay citas programadas para este día. Pulsa «Nueva cita» para añadir una.')}</div>`}
window.selectDay=d=>{selectedDay=d;render()};

function clientsRows(){return filterClients().map(c=>{const n=data.orders.filter(o=>o.clientId===c.id).length;return `<tr class="clickable" onclick="openClient(${c.id})"><td><span class="primary-cell">${esc(c.name)}</span><span class="secondary-cell">${esc(c.email)}</span></td><td>${esc(c.phone)}</td><td><span class="primary-cell">${esc(c.car)}</span><span class="secondary-cell">${esc(c.plate)}</span></td><td>${n} trabajos</td><td><button class="tiny-button" onclick="event.stopPropagation();openClient(${c.id})">Ver ficha ${ic('chevron',12)}</button></td></tr>`}).join('')}

function filterStock(){return data.stock.filter(s=>[s.name,s.sku,s.category].join(' ').toLowerCase().includes(searchTerm)&&(statusFilter==='all'||s.qty<=s.min))}
function stockRows(){return filterStock().map(s=>`<tr><td><span class="primary-cell">${esc(s.name)}</span><span class="secondary-cell">${esc(s.sku)}</span></td><td>${esc(s.category)}</td><td><strong class="${s.qty<=s.min?'low':''}">${s.qty} uds.</strong></td><td><div class="progress-track"><div class="progress-fill ${s.qty<=s.min?'alert':''}" style="width:${Math.min(100,Math.round(s.qty/Math.max(10,s.min*2)*100))}%"></div></div></td><td>${euro(s.price)}</td><td><button class="tiny-button" onclick="restock(${s.id})">+ Reponer</button></td></tr>`).join('')}
function stockView(){const low=data.stock.filter(s=>s.qty<=s.min).length;return `${pageHead('ALMACÉN','Recambios y stock','Controla existencias y detecta los productos que faltan.',btn('Añadir recambio','openNewStock()'))}<div class="inventory-stats"><div class="metric-pill">Referencias <b>${data.stock.length}</b></div><div class="metric-pill">Stock bajo <b style="color:#ce842b">${low}</b></div><div class="metric-pill">Valor del inventario <b>${euro(data.stock.reduce((a,x)=>a+x.qty*x.price,0))}</b></div></div><div class="toolbar"><label class="search">${ic('search',18)}<input aria-label="Buscar recambios" placeholder="Buscar recambio o referencia..." oninput="searchPage(this.value)"></label><select class="filter" onchange="filterPage(this.value)"><option value="all">Todo el inventario</option><option value="low">Solo stock bajo</option></select></div>${tableWrap(['PRODUCTO','CATEGORÍA','EXISTENCIAS','NIVEL','PRECIO/UD.','ACCIÓN'],stockRows()).replace('<tbody>','<tbody id="dynamic-rows">')}<div class="section-foot" id="record-count">${filterStock().length} resultados</div>`}
function filterQuotes(){return [...data.quotes].sort((a,b)=>b.id-a.id).filter(q=>(statusFilter==='all'||q.status===statusFilter)&&[q.id,q.concept,client(q.clientId).name,client(q.clientId).plate].join(' ').toLowerCase().includes(searchTerm))}
function quotesRows(){return filterQuotes().map(q=>`<tr class="clickable" onclick="openQuote(${q.id})"><td><span class="primary-cell">PRE-${q.id}</span><span class="secondary-cell">${fmtDate(q.date)}</span></td><td>${esc(client(q.clientId).name)}</td><td><span class="primary-cell">${esc(q.concept)}</span><span class="secondary-cell">${esc(client(q.clientId).plate)}</span></td><td>${badge(q.status)}</td><td><span class="primary-cell">${euro(q.qty*q.unit*1.21)}</span><span class="secondary-cell">IVA incluido</span></td><td><button class="tiny-button" onclick="event.stopPropagation();openQuote(${q.id})">Abrir ${ic('chevron',12)}</button></td></tr>`).join('')}
function quotesView(){return `${pageHead('COMERCIAL','Presupuestos','Prepara ofertas claras y listas para imprimir.',btn('Nuevo presupuesto','openNewQuote()'))}<div class="toolbar"><label class="search">${ic('search',18)}<input aria-label="Buscar presupuestos" placeholder="Buscar por cliente, concepto o número..." oninput="searchPage(this.value)"></label><select class="filter" onchange="filterPage(this.value)"><option value="all">Todos los estados</option><option value="pending">Pendientes</option><option value="accepted">Aceptados</option><option value="rejected">Rechazados</option></select></div>${tableWrap(['N.º PRESUPUESTO','CLIENTE','CONCEPTO','ESTADO','TOTAL','ACCIÓN'],quotesRows()).replace('<tbody>','<tbody id="dynamic-rows">')}<div class="section-foot" id="record-count">${filterQuotes().length} resultados</div>`}
function showDrawer(title,subtitle,content,wide=false){document.getElementById('modal-root').innerHTML=`<div class="backdrop" onclick="if(event.target===this)closeDrawer()"><div class="drawer ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="drawer-top"><div><h2>${esc(title)}</h2><p>${esc(subtitle)}</p></div><button class="close" onclick="closeDrawer()" aria-label="Cerrar">×</button></div>${content}</div></div>`}
window.closeDrawer=()=>document.getElementById('modal-root').innerHTML='';
window.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeDrawer()});
const field=(label,name,type='text',opts={})=>`<div class="field"><label for="f-${name}">${esc(label)}</label>${opts.select?`<select id="f-${name}" name="${name}" ${opts.required?'required':''}>${opts.select}</select>`:opts.textarea?`<textarea id="f-${name}" name="${name}" placeholder="${esc(opts.placeholder||'')}"></textarea>`:`<input id="f-${name}" name="${name}" type="${type}" ${opts.value!==undefined?`value="${esc(opts.value)}"`:''} ${opts.required?'required':''} ${opts.min!==undefined?`min="${opts.min}"`:''} ${opts.step?`step="${opts.step}"`:''} placeholder="${esc(opts.placeholder||'')}">`}</div>`;
const clientOptions=(selected=null)=>data.clients.map(c=>`<option value="${c.id}" ${selected!==null&&String(selected)===String(c.id)?'selected':''}>${esc(c.name)} · ${esc(c.plate)}</option>`).join('');
const formActions=(label)=>`<div class="drawer-actions"><button type="button" class="btn" onclick="closeDrawer()">Cancelar</button><button type="submit" class="btn primary">${ic('check',16)} ${label}</button></div>`;
const readForm=form=>Object.fromEntries(new FormData(form).entries());
window.openNewOrder=()=>showDrawer('Nueva orden de trabajo','Registra una reparación en unos segundos.',`<form class="form" onsubmit="submitOrder(event)">${field('Cliente / vehículo','clientId','text',{select:clientOptions(),required:true})}${field('Trabajo a realizar','subject','text',{required:true,placeholder:'Ej. Revisión de frenos'})}${field('Descripción del trabajo','details','text',{textarea:true,placeholder:'Añade los detalles de la reparación...'})}<div class="form-grid">${field('Presupuesto base (€)','price','number',{required:true,min:0,step:'0.01',value:95})}${field('Fecha de entrada','date','date',{required:true,value:today()})}</div>${formActions('Crear orden')}</form>`);
window.submitOrder=ev=>{ev.preventDefault();const f=readForm(ev.target);const id=Math.max(1042,...data.orders.map(x=>x.id))+1;const c=client(f.clientId);data.orders.unshift({id,clientId:+f.clientId,subject:f.subject.trim(),details:f.details.trim(),status:'waiting',price:+f.price,date:f.date,plate:c.plate});persist();closeDrawer();render();notify('Orden #OT-'+id+' creada correctamente')};
window.openOrder=id=>{const o=data.orders.find(x=>x.id===id);if(!o)return;const c=client(o.clientId);showDrawer('Orden #OT-'+o.id,'Seguimiento del trabajo y del vehículo.',`<div class="detail-banner"><div><small>Estado actual</small>${badge(o.status)}</div><div style="text-align:right"><small>Importe estimado</small><b>${euro(o.price)}</b></div></div><div class="info-grid"><div class="info-box"><span>Cliente</span><strong>${esc(c.name)}</strong></div><div class="info-box"><span>Teléfono</span><strong>${esc(c.phone)}</strong></div><div class="info-box"><span>Vehículo</span><strong>${esc(c.car)}</strong></div><div class="info-box"><span>Matrícula</span><strong>${esc(o.plate||c.plate)}</strong></div></div><div class="subhead">Descripción del trabajo</div><p style="font-size:14px;font-weight:800">${esc(o.subject)}</p><p class="note">${esc(o.details||'Sin detalles adicionales.')}</p><div class="subhead">Actualizar estado</div><div class="field"><select id="order-status"><option value="waiting" ${o.status==='waiting'?'selected':''}>Pendiente</option><option value="progress" ${o.status==='progress'?'selected':''}>En reparación</option><option value="done" ${o.status==='done'?'selected':''}>Finalizado</option><option value="cancelled" ${o.status==='cancelled'?'selected':''}>Cancelado</option></select></div><div class="drawer-actions"><button class="btn soft" onclick="quoteFromOrder(${id})">${ic('quotes')} Crear presupuesto</button><button class="btn primary" onclick="updateOrder(${id})">${ic('check')} Guardar cambios</button></div>`) };
window.updateOrder=id=>{const o=data.orders.find(x=>x.id===id);o.status=document.getElementById('order-status').value;persist();closeDrawer();render();notify('Estado de la orden actualizado')};
window.openNewAppointment=()=>showDrawer('Nueva cita','Reserva una hora para recibir un vehículo.',`<form class="form" onsubmit="submitAppointment(event)">${field('Cliente','clientId','text',{select:clientOptions(),required:true})}${field('Motivo de la visita','type','text',{required:true,placeholder:'Ej. Cambio de neumáticos'})}<div class="form-grid">${field('Fecha','date','date',{required:true,value:selectedDay})}${field('Hora','time','time',{required:true,value:'10:00'})}</div><p class="note">La demo no comprueba el número de mecánicos disponibles por franja horaria.</p>${formActions('Guardar cita')}</form>`);
window.submitAppointment=e=>{e.preventDefault();const f=readForm(e.target);data.appointments.push({id:Math.max(0,...data.appointments.map(x=>x.id))+1,clientId:+f.clientId,date:f.date,time:f.time,type:f.type.trim(),status:'confirmed'});selectedDay=f.date;persist();closeDrawer();render();notify('Cita añadida a la agenda')};
window.cancelAppointment=id=>{const a=data.appointments.find(x=>x.id===id);if(!a||!confirm('¿Quieres cancelar esta cita?'))return;a.status='cancelled';persist();render();notify('Cita cancelada')};
window.openNewClient=()=>showDrawer('Nuevo cliente','Crea una ficha para un vehículo.',`<form class="form" onsubmit="submitClient(event)">${field('Nombre y apellidos','name','text',{required:true,placeholder:'Nombre del cliente'})}<div class="form-grid">${field('Teléfono','phone','tel',{required:true,placeholder:'600 000 000'})}${field('Correo electrónico','email','email',{placeholder:'correo@ejemplo.com'})}</div><div class="form-grid">${field('Vehículo (modelo y año)','car','text',{required:true,placeholder:'Ford Focus · 2020'})}${field('Matrícula','plate','text',{required:true,placeholder:'0000 ABC'})}</div>${formActions('Guardar cliente')}</form>`);
window.submitClient=e=>{e.preventDefault();let f=readForm(e.target);f.name=f.name.trim();f.plate=f.plate.trim().toUpperCase();data.clients.push({id:Math.max(0,...data.clients.map(x=>x.id))+1,...f});persist();closeDrawer();render();notify('Cliente registrado correctamente')};
window.openClient=id=>{const c=client(id);const orders=data.orders.filter(o=>o.clientId===id);showDrawer('Ficha de '+c.name,'Historial de reparaciones y datos del cliente.',`<div class="info-grid"><div class="info-box"><span>Teléfono</span><strong>${esc(c.phone)}</strong></div><div class="info-box"><span>Email</span><strong>${esc(c.email||'No indicado')}</strong></div><div class="info-box"><span>Vehículo</span><strong>${esc(c.car)}</strong></div><div class="info-box"><span>Matrícula</span><strong>${esc(c.plate)}</strong></div></div><div class="subhead">Historial de reparaciones (${orders.length})</div>${orders.length?orders.map(o=>`<div class="event" style="margin-bottom:15px"><div class="event-body"><strong>${esc(o.subject)}</strong><span>#OT-${o.id} · ${fmtDate(o.date)}</span></div>${badge(o.status)}</div>`).join(''):blank('Este cliente todavía no tiene reparaciones.')}<div class="drawer-actions"><button class="btn primary" onclick="closeDrawer();openNewOrder()">${ic('plus')} Nueva orden</button></div>`)};
window.openNewStock=()=>showDrawer('Añadir recambio','Crea una nueva referencia del almacén.',`<form class="form" onsubmit="submitStock(event)">${field('Descripción del producto','name','text',{required:true,placeholder:'Ej. Filtro de combustible'})}<div class="form-grid">${field('Referencia / SKU','sku','text',{required:true,placeholder:'FIL-026'})}${field('Categoría','category','text',{required:true,placeholder:'Filtros'})}</div><div class="form-grid">${field('Existencias iniciales','qty','number',{required:true,min:0,value:4})}${field('Avisar si quedan...','min','number',{required:true,min:0,value:3})}</div>${field('Precio de venta (€)','price','number',{required:true,min:0,step:'0.01',value:25})}${formActions('Añadir al inventario')}</form>`);
window.submitStock=e=>{e.preventDefault();let f=readForm(e.target);data.stock.push({id:Math.max(0,...data.stock.map(x=>x.id))+1,name:f.name,sku:f.sku,category:f.category,qty:+f.qty,min:+f.min,price:+f.price});persist();closeDrawer();render();notify('Recambio añadido al inventario')};
window.restock=id=>{const p=data.stock.find(x=>x.id===id);const val=prompt(`¿Cuántas unidades quieres añadir de «${p.name}»?`,'5');if(val===null)return;const n=Number(val);if(!Number.isInteger(n)||n<=0){alert('Introduce un número entero mayor que cero.');return}p.qty+=n;persist();render();notify('Stock actualizado: +'+n+' unidades')};
window.quoteFromOrder=id=>{const o=data.orders.find(x=>x.id===id);openNewQuote({clientId:o.clientId,concept:o.subject,unit:o.price,orderId:o.id})};
window.openNewQuote=(defaults={})=>showDrawer('Nuevo presupuesto','El importe final incluye IVA del 21%.',`<form class="form" onsubmit="submitQuote(event)">${field('Cliente / vehículo','clientId','text',{select:clientOptions(defaults.clientId),required:true})}${field('Descripción del servicio','concept','text',{required:true,value:defaults.concept||'',placeholder:'Ej. Sustitución de embrague'})}<div class="form-grid">${field('Cantidad','qty','number',{required:true,min:1,step:'1',value:1})}${field('Precio unitario sin IVA (€)','unit','number',{required:true,min:0,step:'0.01',value:defaults.unit||100})}</div><input type="hidden" name="orderId" value="${defaults.orderId||''}"><div class="quote-highlight"><strong id="live-total">${euro((defaults.unit||100)*1.21)}</strong><span>Total con IVA (21%)</span></div>${formActions('Guardar presupuesto')}</form>`); 
window.submitQuote=e=>{e.preventDefault();const f=readForm(e.target);const id=Math.max(200,...data.quotes.map(x=>x.id))+1;data.quotes.unshift({id,clientId:+f.clientId,orderId:f.orderId?+f.orderId:null,concept:f.concept.trim(),qty:+f.qty,unit:+f.unit,date:today(),status:'pending'});persist();closeDrawer();navigate('quotes');notify('Presupuesto PRE-'+id+' guardado')};
document.addEventListener('input',ev=>{if(ev.target?.name==='qty'||ev.target?.name==='unit'){const f=ev.target.closest('form');if(!f||!f.querySelector('[name="unit"]')||!f.querySelector('[name="qty"]'))return;const total=(Number(f.elements.qty.value)||0)*(Number(f.elements.unit.value)||0)*1.21;const el=document.getElementById('live-total');if(el)el.textContent=euro(total)}});
window.openQuote=id=>{const q=data.quotes.find(x=>x.id===id);const c=client(q.clientId);showDrawer('Presupuesto PRE-'+q.id,'Oferta del '+fmtDate(q.date),`<div class="detail-banner"><div><small>Estado actual</small>${badge(q.status)}</div><div style="text-align:right"><small>Total IVA incluido</small><b>${euro(q.qty*q.unit*1.21)}</b></div></div><div class="info-grid"><div class="info-box"><span>Cliente</span><strong>${esc(c.name)}</strong></div><div class="info-box"><span>Vehículo / matrícula</span><strong>${esc(c.car)} · ${esc(c.plate)}</strong></div></div><div class="subhead">Concepto</div><p style="font-weight:750">${esc(q.concept)}</p><div class="total-box"><div class="total-line"><span>${q.qty} × ${euro(q.unit)}</span><strong>${euro(q.qty*q.unit)}</strong></div><div class="total-line"><span>IVA 21%</span><strong>${euro(q.qty*q.unit*.21)}</strong></div><div class="total-line"><span>Importe total</span><strong>${euro(q.qty*q.unit*1.21)}</strong></div></div><div class="subhead">Estado del presupuesto</div><div class="field"><select id="quote-status"><option value="pending" ${q.status==='pending'?'selected':''}>Pendiente</option><option value="accepted" ${q.status==='accepted'?'selected':''}>Aceptado</option><option value="rejected" ${q.status==='rejected'?'selected':''}>Rechazado</option></select></div><div class="drawer-actions"><button class="btn" onclick="printQuote(${id})">${ic('printer')} Imprimir / PDF</button><button class="btn primary" onclick="updateQuote(${id})">${ic('check')} Guardar estado</button></div>`)};
window.updateQuote=id=>{const q=data.quotes.find(x=>x.id===id);q.status=document.getElementById('quote-status').value;persist();closeDrawer();render();notify('Presupuesto actualizado')};
window.printQuote=id=>{const q=data.quotes.find(x=>x.id===id),c=client(q.clientId),base=q.qty*q.unit;document.getElementById('print-sheet').innerHTML=`<div class="print-header"><div><h1>Taller Motor Norte</h1><p>Documento de demostración · No válido como factura</p></div><div style="text-align:right"><strong>PRESUPUESTO PRE-${q.id}</strong><p>Fecha: ${fmtDate(q.date)}</p></div></div><p><strong>Cliente:</strong> ${esc(c.name)}<br><strong>Vehículo:</strong> ${esc(c.car)}<br><strong>Matrícula:</strong> ${esc(c.plate)}</p><table><thead><tr><th>Descripción</th><th>Cant.</th><th>Precio</th><th>Subtotal</th></tr></thead><tbody><tr><td>${esc(q.concept)}</td><td>${q.qty}</td><td>${euro(q.unit)}</td><td>${euro(base)}</td></tr></tbody></table><p style="text-align:right">Base imponible: ${euro(base)}<br>IVA (21%): ${euro(base*.21)}</p><div class="ptotal">TOTAL: ${euro(base*1.21)}</div><p class="pnote">Esta es una demo. No incluye datos fiscales reales ni condiciones contractuales.</p>`;window.print()};
window.openHelp=()=>showDrawer('¡Prueba el programa!','TallerOS · Simulación funcional',`<div style="padding-top:22px"><p style="line-height:1.8;color:#53657e">Esta demo enseña cómo funcionaría un software para pequeños talleres. Puedes <b>crear clientes, abrir órdenes, cambiar estados, reservar citas, controlar stock y generar presupuestos imprimibles</b>.</p><div class="subhead">Prueba rápida</div><div class="info-box" style="line-height:2"><b>1.</b> Entra en «Órdenes de trabajo» y crea una nueva.<br><b>2.</b> Cámbiala a «En reparación».<br><b>3.</b> Genera un presupuesto y pulsa «Imprimir / PDF».<br><b>4.</b> En «Recambios y stock» repón un artículo.</div><div class="subhead">Importante</div><p class="note">No es un producto listo para vender: los datos se guardan solo en este navegador. No tiene usuarios, base de datos compartida, envío de mensajes ni facturación electrónica. Ningún dato de la demo se envía a un servidor.</p><div class="drawer-actions" style="justify-content:space-between"><button class="btn danger" onclick="resetDemo()">${ic('refresh')} Restablecer datos</button><button class="btn primary" onclick="closeDrawer()">Entendido</button></div></div>`);
window.resetDemo=()=>{if(!confirm('¿Reiniciar la demo? Se perderán los datos que hayas introducido en este navegador.'))return;data=seed();persist();selectedDay=today();closeDrawer();navigate('dashboard');notify('Demo restablecida')};
render();
})();
</script>
</body>
</html>
